name: private-movie

services:
  db:
    image: postgres:16-alpine
    container_name: private-movie-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-migrate:
    image: oven/bun:1
    container_name: private-movie-db-migrate
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: bunx turbo run db:migrate --filter=@repo/db

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: private-movie-backend
    env_file:
      - .env.docker
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
