name: private-movie

services:
  db:
    image: postgres:16-alpine
    container_name: private-movie-db
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-migrate:
    image: oven/bun:1
    container_name: private-movie-db-migrate
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bunx turbo run db:migrate --filter=@repo/db && bunx turbo run db:seed --filter=@repo/db"

  backend:
    image: ghcr.io/titanaprilian/private-movie-backend:latest
    container_name: private-movie-backend
    env_file:
      - .env.docker
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/titanaprilian/private-movie-web:latest
    container_name: private-movie-web
    env_file:
      - .env.docker
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    depends_on:
      - backend
