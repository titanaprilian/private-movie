<?xml version="1.0" encoding="UTF-8"?>
<svg
        viewBox="0 0 1040 540"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="pstack-flow-title pstack-flow-desc" id="pstack-workflow-root"
      >
        <title id="pstack-flow-title">pstack Multi-Tier Orchestration and Agent Workflow</title>
        <desc id="pstack-flow-desc">Four swimlanes showing Operator, Orchestrator, Worker Agent, and Delegated Subagents executing grilling interview, poteto-mode handoff, coding, verification, and automated PR shipping.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pstack-workflow-root { --color-paper: #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-rule: rgba(45, 49, 66, 0.12);
      --color-rule-solid: #bfc0c0;
      --color-accent: #bf4520;
      --color-accent-tint: rgba(191, 69, 32, 0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #pstack-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pstack-workflow-root .container { max-width: 1200px;
      margin: 0 auto; }
      #pstack-workflow-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #pstack-workflow-root .subtitle { font-size: 0.95rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 64ch; }
      #pstack-workflow-root .diagram-container { background: var(--color-paper-2);
      border-radius: 8px;
      border: 1px solid var(--color-rule);
      padding: 1.5rem;
      overflow-x: auto; }
      #pstack-workflow-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.875rem;
      padding-bottom: 0.875rem;
      border-bottom: 1px solid rgba(45, 49, 66, 0.08); }
      #pstack-workflow-root .card-dot { width: 7px;
      height: 7px;
      border-radius: 50%; }
      #pstack-workflow-root .card-dot.ink { background: var(--color-ink); }
      #pstack-workflow-root .card-dot.coral { background: var(--color-accent); }
      #pstack-workflow-root .card-dot.muted { background: var(--color-muted); }</style>
          <pattern id="pstack-workflow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="pstack-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="pstack-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
        </defs>

        <!-- Base backgrounds -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#pstack-workflow-dots)" opacity="0.6"/>

        <!-- Lane horizontal dividers -->
        <line x1="32" y1="64" x2="1008" y2="64" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="32" y1="160" x2="1008" y2="160" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="32" y1="256" x2="1008" y2="256" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="32" y1="368" x2="1008" y2="368" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <line x1="32" y1="472" x2="1008" y2="472" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>

        <!-- Actor column vertical divider -->
        <line x1="176" y1="64" x2="176" y2="472" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>

        <!-- Lane labels in left margin -->
        <text x="48" y="104" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">OPERATOR</text>
        <text x="48" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">HUMAN / USER</text>

        <text x="48" y="200" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">ORCHESTRATOR</text>
        <text x="48" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROOT SESSION</text>

        <text x="48" y="304" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">WORKER AGENT</text>
        <text x="48" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">HERDR PANE</text>

        <text x="48" y="412" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">SUBAGENTS</text>
        <text x="48" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">DELEGATED LEAF</text>

        <!-- CONNECTORS (Drawn before boxes per paint order rule) -->

        <!-- 1. Operator Prompt -> Orchestrator Intake (Straight vertical down) -->
        <line x1="264" y1="140" x2="264" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 2. Orchestrator Intake -> Worker Grilling (Right-angle elbow down-right) -->
        <path d="M 336,212 H 416 Q 424,212 424,220 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 3. Worker Grilling -> Operator Approve (Straight vertical up: Batched Questions) -->
        <line x1="436" y1="288" x2="436" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 4. Operator Approve -> Worker Grilling (Straight vertical down: Single-Turn Approval) -->
        <line x1="484" y1="140" x2="484" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 5. Worker Grilling -> Worker Poteto-Mode (Straight horizontal right: FOCAL HANDOFF) -->
        <line x1="512" y1="320" x2="592" y2="320" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pstack-workflow-arrow-accent)"/>

        <!-- 6. Worker Poteto-Mode -> Subagent Coding (Straight vertical down) -->
        <line x1="660" y1="356" x2="660" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 7. Subagent Coding -> Subagent Verify (Straight horizontal right) -->
        <line x1="740" y1="424" x2="800" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 8. Subagent Verify -> Worker Poteto-Mode (Elbow up-left: Gate verdict return) -->
        <path d="M 836,396 V 328 Q 836,320 828,320 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 9. Worker Poteto-Mode -> Orchestrator Cleanup (Elbow up-right: WORK_COMPLETE reverse prompt) -->
        <path d="M 724,284 V 220 Q 724,212 732,212 H 800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- 10. Orchestrator Cleanup -> Operator Delivered PR (Straight vertical up) -->
        <line x1="880" y1="184" x2="880" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>

        <!-- CONNECTOR LABELS (With opaque masks) -->
        <!-- Label 1: INTAKE -->
        <rect x="242" y="156" width="44" height="12" rx="2" fill="#ececec"/>
        <text x="264" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTAKE</text>

        <!-- Label 2: SPAWN WORKER -->
        <rect x="340" y="206" width="72" height="12" rx="2" fill="#ececec"/>
        <text x="376" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN PANE</text>

        <!-- Label 3: FRONTIER Qs -->
        <rect x="396" y="232" width="80" height="12" rx="2" fill="#ececec"/>
        <text x="436" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FRONTIER Qs</text>

        <!-- Label 4: APPROVE ALL -->
        <rect x="444" y="172" width="80" height="12" rx="2" fill="#ececec"/>
        <text x="484" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE ALL</text>

        <!-- Label 5: FOCAL HANDOFF -->
        <rect x="520" y="314" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="323" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HANDOFF</text>

        <!-- Label 6: DELEGATE -->
        <rect x="632" y="370" width="56" height="12" rx="2" fill="#ececec"/>
        <text x="660" y="379" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELEGATE</text>

        <!-- Label 7: DIFF & TESTS -->
        <rect x="744" y="418" width="52" height="12" rx="2" fill="#ececec"/>
        <text x="770" y="427" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PR DIFF</text>

        <!-- Label 8: GATE VERDICT -->
        <rect x="764" y="314" width="60" height="12" rx="2" fill="#ececec"/>
        <text x="794" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE PASS</text>

        <!-- Label 9: WORK COMPLETE -->
        <rect x="730" y="206" width="68" height="12" rx="2" fill="#ececec"/>
        <text x="764" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPLETE</text>

        <!-- Label 10: SHIPPED -->
        <rect x="856" y="156" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="880" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHIPPED</text>


        <!-- NODES (Mask rect + styled box + badge chip + typography) -->

        <!-- Node 1: Operator Prompt (Lane 1) -->
        <g id="node-1">
          <rect x="192" y="84" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="192" y="84" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="202" y="92" width="38" height="12" rx="2" fill="#ececec"/>
          <text x="221" y="101" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PROMPT</text>
          <text x="202" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Goal &amp; Issue</text>
          <text x="202" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">task intent · issue #id</text>
        </g>

        <!-- Node 2: Orchestrator Intake (Lane 2) -->
        <g id="node-2">
          <rect x="192" y="184" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="192" y="184" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="202" y="192" width="44" height="12" rx="2" fill="#ececec"/>
          <text x="224" y="201" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DISPATCH</text>
          <text x="202" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Intake &amp; Worktree</text>
          <text x="202" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">branch setup · open pane</text>
        </g>

        <!-- Node 3: Worker Grilling (Lane 3) -->
        <g id="node-3">
          <rect x="360" y="288" width="152" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="360" y="288" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="370" y="296" width="48" height="12" rx="2" fill="#ececec"/>
          <text x="394" y="305" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GRILLING</text>
          <text x="370" y="324" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Decision Tree</text>
          <text x="370" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">explores repo · batches Qs</text>
        </g>

        <!-- Node 4: Operator Approve Frontier (Lane 1) -->
        <g id="node-4">
          <rect x="360" y="84" width="152" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="360" y="84" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="370" y="92" width="34" height="12" rx="2" fill="#ececec"/>
          <text x="387" y="101" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GATE</text>
          <text x="370" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Approve Frontier</text>
          <text x="370" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">single-turn 'approve all'</text>
        </g>

        <!-- Node 5: Poteto-Mode Hub (Lane 3 - FOCAL ELEMENT) -->
        <g id="node-5">
          <rect x="592" y="284" width="168" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="592" y="284" width="168" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
          <rect x="602" y="292" width="68" height="12" rx="2" fill="#bf4520"/>
          <text x="636" y="301" fill="#ffffff" font-size="7" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">POTETO-MODE</text>
          <text x="602" y="325" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Playbook Execution</text>
          <text x="602" y="340" fill="#bf4520" font-size="8" font-weight="500" font-family="'Geist Mono', monospace">spec synthesis · gatekeeper</text>
        </g>

        <!-- Node 6: Subagent Code & TDD (Lane 4) -->
        <g id="node-6">
          <rect x="600" y="396" width="140" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="600" y="396" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="610" y="404" width="38" height="12" rx="2" fill="#ececec"/>
          <text x="629" y="413" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CODING</text>
          <text x="610" y="432" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Code &amp; TDD</text>
          <text x="610" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">poteto-agent · architect</text>
        </g>

        <!-- Node 7: Subagent Verify & Audit (Lane 4) -->
        <g id="node-7">
          <rect x="800" y="396" width="160" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="800" y="396" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="810" y="404" width="48" height="12" rx="2" fill="#ececec"/>
          <text x="834" y="413" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">AUDIT</text>
          <text x="810" y="432" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Verify &amp; Review</text>
          <text x="810" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">verify · thermos · deslop</text>
        </g>

        <!-- Node 8: Orchestrator Merge & Cleanup (Lane 2) -->
        <g id="node-8">
          <rect x="800" y="184" width="160" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="800" y="184" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="810" y="192" width="46" height="12" rx="2" fill="#ececec"/>
          <text x="833" y="201" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CLEANUP</text>
          <text x="810" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Merge &amp; Cleanup</text>
          <text x="810" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">verify PR · remove worktree</text>
        </g>

        <!-- Node 9: Operator Delivered PR (Lane 1) -->
        <g id="node-9">
          <rect x="800" y="84" width="160" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="800" y="84" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="810" y="92" width="40" height="12" rx="2" fill="#ececec"/>
          <text x="830" y="101" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OUTPUT</text>
          <text x="810" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Delivered PR</text>
          <text x="810" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">closed issue · summary report</text>
        </g>

        <!-- BOTTOM LEGEND STRIP -->
        <line x1="32" y1="492" x2="1008" y2="492" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>

        <!-- Legend Items -->
        <line x1="48" y1="514" x2="72" y2="514" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pstack-workflow-arrow)"/>
        <text x="80" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Primary Flow</text>

        <line x1="184" y1="514" x2="208" y2="514" stroke="#bf4520" stroke-width="1.5" marker-end="url(#pstack-workflow-arrow-accent)"/>
        <text x="216" y="517" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', monospace">Focal Handoff</text>

        <line x1="324" y1="514" x2="348" y2="514" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pstack-workflow-arrow)"/>
        <text x="356" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Gate / Return</text>

        <rect x="464" y="508" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="484" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Step Node</text>

        <rect x="568" y="508" width="12" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.06"/>
        <text x="588" y="517" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', monospace">Focal Node</text>

        <text x="968" y="517" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">4 TIERS · 9 NODES · 10 EDGES</text>
      </svg>
