name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root_password
          POSTGRES_DB: private_movie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_DAEMON: "false"
      DATABASE_URL: postgres://postgres:root_password@localhost:5432/private_movie_test
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Run CI pipeline
        run: |
          bun x turbo run db:migrate --env-mode=loose
          bun x turbo run typecheck lint test:coverage test:integration build --continue --filter=!@repo/android-tv --env-mode=loose

      - name: Run Structural Quality Gates (L5)
        run: |
          bun run test:gate
          bun run gate:check
          bun run check:docs

      - name: Run Trivy vulnerability scanner (dependency audit)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "library"
          severity: "CRITICAL"
          skip-dirs: "node_modules,apps/android-tv/.gradle,apps/android-tv/build"

      - name: Download base branch coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p coverage/base
          RUN_ID=$(gh run list --workflow ci.yml --branch "${{ github.base_ref }}" --status success --event push --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow ci.yml --branch "${{ github.base_ref }}" --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          fi
          if [ -n "$RUN_ID" ]; then
            echo "Downloading base coverage artifact from run $RUN_ID..."
            gh run download "$RUN_ID" -n coverage-reports -D coverage/base 2>/dev/null || echo "Base coverage artifact not found in run $RUN_ID"
          else
            echo "No successful base branch run found for ${{ github.base_ref }}"
          fi

      - name: Coverage summary
        if: always()
        run: bun scripts/coverage-summary.ts --base-dir coverage/base

      - name: Post coverage sticky comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: coverage-summary
          path: coverage/summary.md

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_DAEMON: "false"
      BACKEND_API_URL: "https://example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Android CI pipeline
        run: bun x turbo run typecheck lint test build --continue --filter=@repo/android-tv --env-mode=loose

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root_password
          POSTGRES_DB: private_movie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_DAEMON: "false"
      DATABASE_URL: postgres://postgres:root_password@localhost:5432/private_movie_test
      JWT_SECRET: 514fbdf9f074b52110b9f1d48a73ea7edf8a8f9abbc0766c7319fe1a4650fadc
      VITE_API_URL: http://localhost:3000
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium (attempt $attempt/3)..."
            if bun run test:e2e:install; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed, running apt-get update --fix-missing before retry..."
              sudo apt-get update --fix-missing || true
              sleep 5
            else
              echo "Failed to install Playwright after 3 attempts."
              exit 1
            fi
          done

      - name: Run DB Migrations
        run: bun x turbo run db:migrate --env-mode=loose

      - name: Build applications
        run: bun x turbo run build --filter=!@repo/android-tv --env-mode=loose

      - name: Run E2E Smoke Tests
        run: bun run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish-and-deploy:
    name: Publish & Deploy
    needs: [ci, android, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
