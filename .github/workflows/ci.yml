name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root_password
          POSTGRES_DB: private_movie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_DAEMON: "false"
      DATABASE_URL: postgres://postgres:root_password@localhost:5432/private_movie_test
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI pipeline
        run: |
          bun x turbo run db:migrate --env-mode=loose
          bun x turbo run typecheck lint test test:integration build --continue --filter=!@repo/android-tv --env-mode=loose

      - name: Run Quality Gate Check & Tests (L4)
        run: |
          bun run test:gate
          bun run gate:check

      - name: Run Trivy vulnerability scanner (dependency audit)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "library"
          severity: "CRITICAL"
          skip-dirs: "node_modules,apps/android-tv/.gradle,apps/android-tv/build"

      - name: Run coverage
        run: bun x turbo run test:coverage --continue --filter=!@repo/android-tv --env-mode=loose

      - name: Coverage summary
        if: always()
        run: bun scripts/coverage-summary.ts

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_DAEMON: "false"
      BACKEND_API_URL: "https://example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Android CI pipeline
        run: bun x turbo run typecheck lint test build --continue --filter=@repo/android-tv --env-mode=loose

  publish-and-deploy:
    name: Publish & Deploy
    needs: [ci, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
