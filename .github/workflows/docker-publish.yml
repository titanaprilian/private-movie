name: Docker Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/**'

  publish-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [changes, publish-backend, publish-web]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.publish-backend.result == 'success' || needs.publish-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Determine services to deploy
        id: target
        run: |
          SERVICES=()
          if [ "${{ needs.publish-backend.result }}" = "success" ]; then
            SERVICES+=("backend")
          fi
          if [ "${{ needs.publish-web.result }}" = "success" ]; then
            SERVICES+=("web")
          fi
          echo "services=${SERVICES[*]}" >> "$GITHUB_OUTPUT"

      - name: Trigger VPS deployment webhook
        run: |
          echo "Triggering deployment for services: ${{ steps.target.outputs.services }}"
          HTTP_CODE=$(curl -s -o /tmp/deploy_trigger.json -w "%{http_code}" -X POST "https://pmov.titanaprilian.me/deploy-webhook" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d "{\"services\": \"${{ steps.target.outputs.services }}\", \"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref }}\"}")

          echo "Trigger response (HTTP $HTTP_CODE):"
          cat /tmp/deploy_trigger.json
          echo ""

          if [ "$HTTP_CODE" -ne 202 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Failed to queue deployment (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Wait for VPS deployment to complete
        run: |
          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            STATUS_JSON=$(curl -s -f "https://pmov.titanaprilian.me/deploy-status" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" || echo '{"status":"unknown"}')

            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "unknown"')
            echo "[+${ELAPSED}s] Deployment status: $STATUS"

            if [ "$STATUS" = "success" ]; then
              echo "Deployment succeeded on VPS!"
              echo "=== VPS Deployment Output ==="
              echo "$STATUS_JSON" | jq -r '.output // "No output"'
              exit 0
            elif [ "$STATUS" = "error" ]; then
              echo "::error::Deployment failed on VPS!"
              echo "=== VPS Deployment Error Output ==="
              echo "$STATUS_JSON" | jq -r '.output // "No output"'
              exit 1
            fi
          done

          echo "::error::Deployment timed out after ${MAX_WAIT}s"
          exit 1